syntax = "proto3";

package statistics;

service StatisticsService {
  rpc GetPostStats(PostRequest) returns (PostStatsResponse);
  rpc GetPostViewsByDay(PostRequest) returns (StatsByDayResponse);
  rpc GetPostLikesByDay(PostRequest) returns (StatsByDayResponse);
  rpc GetPostCommentsByDay(PostRequest) returns (StatsByDayResponse);
  rpc GetTopPostsByMetric(MetricRequest) returns (TopPostsResponse);
  rpc GetTopUsersByMetric(MetricRequest) returns (TopUsersResponse);
}

message PostRequest {
  int32 postId = 1;
}

message MetricRequest {
  string metric = 1;
}

message PostStatsResponse {
  int32 views = 1;
  int32 likes = 2;
  int32 comments = 3;
}

message DailyStatsItem {
  string date = 1;
  int32 count = 2;
}

message StatsByDayResponse {
  repeated DailyStatsItem stats = 1;
}

message TopPost {
  int32 postId = 1;
  int32 count = 2;
}

message TopUser {
  int32 userId = 1;
  int32 count = 2;
}

message TopPostsResponse {
  repeated TopPost posts = 1;
}

message TopUsersResponse {
  repeated TopUser users = 1;
}