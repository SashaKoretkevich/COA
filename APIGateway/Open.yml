components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    postCreate:
      properties:
        title:
          type: string
          maxLength: 30
          minLength: 3
          title: Title
          description: 'Заголовок, от 3 до 30 символов'
        description:
          type: string
          maxLength: 100
          minLength: 10
          title: Description
          description: 'Описание, от 10 до 100 символов'
        isPrivate:
          type: boolean
          title: Isprivate
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Список тегов
      type: object
      required:
        - title
        - description
        - isPrivate
      title: postCreate
    userCreate:
      properties:
        firstName:
          type: string
          maxLength: 30
          minLength: 3
          title: Firstname
          description: 'Имя, от 3 до 30 символов'
        secondName:
          type: string
          maxLength: 30
          minLength: 3
          title: Secondname
          description: 'Фамилия, от 3 до 30 символов'
        userName:
          type: string
          maxLength: 20
          minLength: 3
          title: Username
          description: 'Ник, от 3 до 20 символов'
        mail:
          type: string
          format: email
          title: Mail
          description: Электронная почта
        password:
          type: string
          maxLength: 20
          minLength: 10
          title: Password
          description: 'Пароль, от 10 до 20 знаков'
        age:
          type: integer
          title: Age
        gender:
          type: string
          title: Gender
        status:
          type: string
          maxLength: 30
          minLength: 3
          title: Status
          description: 'Статус, от 3 до 30 знаков'
        phoneNumber:
          type: string
          title: Phonenumber
          description: 'Номер телефона в международном формате, начинающийся с ''+'''
      type: object
      required:
        - firstName
        - secondName
        - userName
        - mail
        - password
        - age
        - gender
        - status
        - phoneNumber
      title: userCreate
    userLogin:
      properties:
        userName:
          anyOf:
            - type: string
              maxLength: 20
              minLength: 3
            - type: 'null'
          title: Username
          description: 'Ник, от 3 до 20 символов'
        mail:
          anyOf:
            - type: string
              format: email
            - type: 'null'
          title: Mail
          description: Электронная почта
        password:
          type: string
          maxLength: 20
          minLength: 10
          title: Password
          description: 'Пароль, от 10 до 20 знаков'
      type: object
      required:
        - password
      title: userLogin
    userUpdate:
      properties:
        firstName:
          type: string
          maxLength: 30
          minLength: 3
          title: Firstname
          description: 'Имя, от 3 до 30 символов'
        secondName:
          type: string
          maxLength: 30
          minLength: 3
          title: Secondname
          description: 'Фамилия, от 3 до 30 символов'
        age:
          type: integer
          title: Age
        gender:
          type: string
          title: Gender
        status:
          type: string
          maxLength: 30
          minLength: 3
          title: Status
          description: 'Статус, от 3 до 30 знаков'
        phoneNumber:
          type: string
          title: Phonenumber
          description: 'Номер телефона в международном формате, начинающийся с ''+'''
        token:
          anyOf:
            - type: string
            - type: 'null'
          title: Token
      type: object
      required:
        - firstName
        - secondName
        - age
        - gender
        - status
        - phoneNumber
      title: userUpdate
