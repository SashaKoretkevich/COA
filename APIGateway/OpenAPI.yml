---
openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  "/register":
    post:
      summary: Register
      operationId: register_register_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/userCreate"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/login":
    post:
      summary: Login
      operationId: login_login_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/userLogin"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/logout":
    post:
      summary: Logout
      operationId: logout_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  "/profile":
    get:
      summary: Getuser
      operationId: getUser_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    put:
      summary: Updateprofile
      operationId: updateProfile_profile_put
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/userUpdate"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/posts/":
    post:
      summary: Createpost
      operationId: createPost_posts__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/postCreate"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
    get:
      summary: Listposts
      operationId: listPosts_posts__get
      parameters:
      - name: offset
        in: query
        required: true
        schema:
          type: integer
          title: Offset
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/posts/{post_id}":
    get:
      summary: Getpost
      operationId: getPost_posts__post_id__get
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
          title: Post Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
    delete:
      summary: Deletepost
      operationId: deletePost_posts__post_id__delete
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
          title: Post Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
    put:
      summary: Updatepost
      operationId: updatePost_posts__post_id__put
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
          title: Post Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/postCreate"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            "$ref": "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    postCreate:
      properties:
        title:
          type: string
          maxLength: 30
          minLength: 3
          title: Title
          description: Заголовок, от 3 до 30 символов
        description:
          type: string
          maxLength: 100
          minLength: 10
          title: Description
          description: Описание, от 10 до 100 символов
        isPrivate:
          type: boolean
          title: Isprivate
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Список тегов
      type: object
      required:
      - title
      - description
      - isPrivate
      title: postCreate
    userCreate:
      properties:
        firstName:
          type: string
          maxLength: 30
          minLength: 3
          title: Firstname
          description: Имя, от 3 до 30 символов
        secondName:
          type: string
          maxLength: 30
          minLength: 3
          title: Secondname
          description: Фамилия, от 3 до 30 символов
        userName:
          type: string
          maxLength: 20
          minLength: 3
          title: Username
          description: Ник, от 3 до 20 символов
        mail:
          type: string
          format: email
          title: Mail
          description: Электронная почта
        password:
          type: string
          maxLength: 20
          minLength: 10
          title: Password
          description: Пароль, от 10 до 20 знаков
        age:
          type: integer
          title: Age
        gender:
          type: string
          title: Gender
        status:
          type: string
          maxLength: 30
          minLength: 3
          title: Status
          description: Статус, от 3 до 30 знаков
        phoneNumber:
          type: string
          title: Phonenumber
          description: Номер телефона в международном формате, начинающийся с '+'
      type: object
      required:
      - firstName
      - secondName
      - userName
      - mail
      - password
      - age
      - gender
      - status
      - phoneNumber
      title: userCreate
    userLogin:
      properties:
        userName:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 3
          - type: 'null'
          title: Username
          description: Ник, от 3 до 20 символов
        mail:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Mail
          description: Электронная почта
        password:
          type: string
          maxLength: 20
          minLength: 10
          title: Password
          description: Пароль, от 10 до 20 знаков
      type: object
      required:
      - password
      title: userLogin
    userUpdate:
      properties:
        firstName:
          type: string
          maxLength: 30
          minLength: 3
          title: Firstname
          description: Имя, от 3 до 30 символов
        secondName:
          type: string
          maxLength: 30
          minLength: 3
          title: Secondname
          description: Фамилия, от 3 до 30 символов
        age:
          type: integer
          title: Age
        gender:
          type: string
          title: Gender
        status:
          type: string
          maxLength: 30
          minLength: 3
          title: Status
          description: Статус, от 3 до 30 знаков
        phoneNumber:
          type: string
          title: Phonenumber
          description: Номер телефона в международном формате, начинающийся с '+'
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      type: object
      required:
      - firstName
      - secondName
      - age
      - gender
      - status
      - phoneNumber
      title: userUpdate
